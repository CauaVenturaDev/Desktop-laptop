# Carrega o módulo do kernel "uinput" no boot, necessário para a injeção de
# entrada do backend evdev (função de teclado/mouse na máquina controlada).
#
# Instalação (com consentimento):
#   sudo cp packaging/linux/perishare-uinput.conf /etc/modules-load.d/
# Para carregar imediatamente, sem reiniciar:
#   sudo modprobe uinput
uinput
